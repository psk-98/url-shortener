networks:
  url-shortener:
    driver: bridge
  url-shrtn-monitoring:
    driver: bridge

services:
  load-balancer:
    image: nginx
    container_name: url-shortener-nginx
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:80"
    networks:
      - url-shortener
    volumes:
      - ./.docker/nginx:/etc/nginx/conf.d

  celery-worker:
    build:
      context: .
      dockerfile: ./.docker/app/Dockerfile
    command: /start-celery-worker
    environment:
      CELERY_BROKER_URL: ${CELERY_BROKER_URI}
    restart: unless-stopped
    networks:
      - url-shortener
    volumes:
      - .:/app
    depends_on:
      - redis
      - db

  flower:
    build:
      context: .
      dockerfile: ./.docker/app/Dockerfile
    command: /start-flower
    environment:
      CELERY_BROKER_URL: ${CELERY_BROKER_URI}
    restart: unless-stopped
    volumes:
      - .:/app
    ports:
      - "5557:5555"
    networks:
      - url-shortener
    depends_on:
      - redis
      - db

  redis:
    image: redis:7
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - url-shortener

  app-1:
    container_name: url-shortener-instance-1
    build:
      context: .
      dockerfile: ./.docker/app/Dockerfile
    command: /start
    restart: unless-stopped
    depends_on:
      - db
    networks:
      - url-shortener
      - url-shrtn-monitoring
  # app-2:
  #   container_name: url-shortener-instance-2
  #   build:
  #     dockerfile: ./.docker/app/Dockerfile
  #   restart: unless-stopped
  #   depends_on:
  #     - db
  #   networks:
  #     - url-shortener
  # app-3:
  #   container_name: url-shortener-instance-3
  #   build:
  #     dockerfile: ./.docker/app/Dockerfile
  #   restart: unless-stopped
  #   depends_on:
  #     - db
  #   networks:
  #     - url-shortener
  db:
    container_name: url-shortener-db
    image: postgres:15
    restart: unless-stopped
    networks:
      - url-shortener
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    ports:
      - "127.0.0.1:6543:5432"
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      PGDATA: /var/lib/postgresql/15

  grafana:
    image: grafana/grafana-oss:12.4.3
    container_name: grafana
    restart: unless-stopped
    networks:
      - url-shrtn-monitoring
    ports:
      - "3000:3000"
    volumes:
      - grafana_storage:/var/lib/grafana

  loki:
    image: grafana/loki
    container_name: loki
    restart: unless-stopped
    networks:
      - url-shrtn-monitoring
    ports:
      - "3100:3100"
    # command:
    #   - -config.file=/etc/loki/loki.yml
    volumes:
      # - ./config/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/prometheus

  node-exporter:
    image: quay.io/prometheus/node-exporter:latest
    container_name: node-exporter
    restart: unless-stopped
    pid: host
    command:
      - --path.rootfs=/host
    volumes:
      - /:/host:ro
    ports:
      - "9100:9100"
    networks:
      - url-shrtn-monitoring

  alloy:
    image: grafana/alloy:v1.18.0
    container_name: alloy
    restart: unless-stopped
    user: "0:0"
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./config/alloy/alloy.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    ports:
      - "12345:12345"
    depends_on:
      - loki
    networks:
      - url-shrtn-monitoring

  prometheus:
    image: prom/prometheus
    container_name: prometheus
    networks:
      - url-shrtn-monitoring
    ports:
      - "9090:9090"
    expose:
      - "9090"
    volumes:
      - ./config/prometheus:/etc/prometheus/
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"

volumes:
  prometheus_data: {}
  grafana_storage: {}
  loki_data: {}
  alloy-data: {}
  postgres_data:
    driver: local
